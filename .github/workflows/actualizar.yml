name: Actualizar tablero de impacto

# Corre solo cada 4 horas en los servidores de GitHub (no depende de que tu
# computador esté encendido), y también se puede disparar a mano desde la
# pestaña "Actions" del repo con el botón "Run workflow".
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # necesario para que el workflow pueda hacer commit del HTML/CSV actualizados

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # sin "cache: pip" ni requirements.txt a propósito: el script no
          # usa ninguna librería externa, solo la estándar de Python.

      - name: DIAGNÓSTICO TEMPORAL -- mapear qué rutas de fundacionexe.org.co responden
        run: |
          python3 - <<'EOF'
          import urllib.request

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "es-CO,es;q=0.9",
          }

          def probar(url):
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = resp.read()
                      print(f"OK   status={resp.status} largo={len(body)}  {url}")
                      return resp.status, body
              except urllib.error.HTTPError as e:
                  print(f"HTTP {e.code}  {url}")
              except Exception as e:
                  print(f"ERROR {type(e).__name__}: {e}  {url}")
              return None, None

          candidatas = [
              "https://fundacionexe.org.co/",
              "https://fundacionexe.org.co/robots.txt",
              "https://fundacionexe.org.co/sitemap.xml",
              "https://fundacionexe.org.co/sitemap_index.xml",
              "https://fundacionexe.org.co/wp-json/",
              "https://fundacionexe.org.co/wp-json/wp/v2/pages?slug=unmillonderazones",
              "https://fundacionexe.org.co/unmillonderazones",
              "https://fundacionexe.org.co/unmillonderazones/index.html",
              "https://www.fundacionexe.org.co/unmillonderazones/",
              "http://fundacionexe.org.co/unmillonderazones/",
          ]

          resultados = {}
          for url in candidatas:
              status, body = probar(url)
              if body:
                  resultados[url] = body

          print()
          print(f"=== {len(resultados)} rutas SÍ respondieron (de {len(candidatas)}) ===")
          for url, body in resultados.items():
              print(f"\n--- {url} (primeros 800 caracteres) ---")
              print(body.decode("utf-8", errors="replace")[:800])
          EOF

      - name: Generar tablero e índice
        run: python actualizar_indice_terremoto.py --out index.html --csv indice_impacto_departamento.csv

      - name: Publicar cambios si hay datos nuevos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualización automática del índice de impacto"
          file_pattern: "index.html indice_impacto_departamento.csv historial_indice.csv indicadores_largo.csv indicadores_largo_no_calculo.csv"
          commit_user_name: "tablero-terremoto-bot"
          commit_user_email: "actions@github.com"
