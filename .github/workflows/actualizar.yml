name: Actualizar datos y tableros
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch: {}
  push:
    branches: [main, formato-largo, reestructuracion-recuperacion]
    paths:
      - '.github/workflows/actualizar.yml'
      - '*.py'
      - 'web/**'
      - 'tests/**'
      - 'data/**'
permissions:
  contents: write
jobs:
  actualizar:
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ github.event_name == 'schedule' && fromJSON('["main","formato-largo","reestructuracion-recuperacion"]') || fromJSON(format('["{0}"]', github.ref_name)) }}
    runs-on: ubuntu-latest
    concurrency:
      group: actualizar-datos-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: DIAGNOSTICO temporal -- anexo IDF
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          pip install openpyxl -q
          mkdir -p /tmp/idf
          U="https://colaboracion.dnp.gov.co/CDT/Desarrollo%20Territorial/Desempeno_Fiscal/ResultadosIDF_Nueva_MetodologIa_2023_Act.xlsx"
          curl -sS -L --max-time 180 "$U" -o /tmp/idf/idf.xlsx
          ls -l /tmp/idf/idf.xlsx
          python3 - <<'PYEOF'
          import openpyxl, re, sys
          wb = openpyxl.load_workbook('/tmp/idf/idf.xlsx', data_only=True, read_only=True)
          print('HOJAS:', wb.sheetnames)
          for name in wb.sheetnames:
              ws = wb[name]
              rows = []
              for i, r in enumerate(ws.iter_rows(values_only=True)):
                  rows.append(r)
                  if i > 40: break
              hdr = None
              for i, r in enumerate(rows):
                  txt = ' '.join(str(c) for c in r if c is not None).lower()
                  if ('digo' in txt or 'divipola' in txt) and ('idf' in txt or 'fiscal' in txt):
                      hdr = i; break
              print('=== HOJA', name, '| fila encabezado:', hdr)
              for i, r in enumerate(rows[:12]):
                  print('  r%02d' % i, [str(c)[:34] for c in r[:14]])
              if hdr is None:
                  continue
              head = [str(c) if c is not None else '' for c in rows[hdr]]
              print('  ENCABEZADO:', head)
              ci = next((j for j, h in enumerate(head)
                         if re.search(r'c(ó|o)digo', h, re.I) and re.search(r'mun|entidad|dane|divipola', h, re.I)), None)
              if ci is None:
                  ci = next((j for j, h in enumerate(head) if re.search(r'c(ó|o)digo|divipola', h, re.I)), None)
              vi = next((j for j, h in enumerate(head)
                         if re.search(r'\bidf\b', h, re.I) and not re.search(r'rank|posici|grupo|clasific', h, re.I)), None)
              if vi is None:
                  vi = next((j for j, h in enumerate(head)
                             if re.search(r'puntaje|indicador de desempe', h, re.I)), None)
              print('  columna codigo:', ci, head[ci] if ci is not None else None)
              print('  columna idf   :', vi, head[vi] if vi is not None else None)
              if ci is None or vi is None:
                  continue
              n = 0
              print('CSVINICIO')
              for r in ws.iter_rows(min_row=hdr + 2, values_only=True):
                  if ci >= len(r) or vi >= len(r):
                      continue
                  c, v = r[ci], r[vi]
                  if c is None or v is None:
                      continue
                  cs = re.sub(r'\D', '', str(c))
                  if len(cs) == 4:
                      cs = '0' + cs
                  if len(cs) != 5:
                      continue
                  try:
                      fv = float(str(v).replace(',', '.'))
                  except ValueError:
                      continue
                  print('IDF,%s,%.4f' % (cs, fv))
                  n += 1
              print('CSVFIN filas=%d' % n)
              if n > 500:
                  sys.exit(0)
          PYEOF
      - name: Verificar importación y cálculos
        run: |
          python -m unittest discover -s tests -v
          if [ -f tests/modelo.test.js ]; then
            node --test tests/*.test.js
            node --check web/tablero.js
          fi
      - name: Descargar datos y regenerar vistas de esta rama
        # Publicar cambios de interfaz en main no depende de fuentes externas.
        # Las descargas conservan su ejecución programada y manual.
        if: github.event_name != 'push' || matrix.branch != 'main'
        run: |
          python actualizar_indice_terremoto.py --out index.html --csv indice_impacto_departamento.csv
          python migrar_clasificacion_3is.py
          if [ -f generar_tablero_recuperacion.py ]; then
            python generar_tablero_recuperacion.py
          else
            python generar_eda_indicadores.py --out eda_indicadores.html
            python generar_indice_educacion.py --out indice_educacion.html
          fi
      - name: Publicar interfaz principal con el inventario conservado
        if: github.event_name == 'push' && matrix.branch == 'main'
        run: python generar_tablero_recuperacion.py
      - name: Verificar familias informativas e interfaz
        if: matrix.branch == 'main'
        run: |
          node scripts/auditar_familias_informativas.cjs
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/familias_informativas.browser.cjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: ${{ matrix.branch }}
          commit_message: 'Actualización automática de datos y tableros'
          file_pattern: '*.html *.csv docs/verificacion_familias_informativas.json'
          commit_user_name: tablero-terremoto-bot
          commit_user_email: actions@github.com


