name: Actualizar tablero de impacto

# Corre solo cada 4 horas en los servidores de GitHub (no depende de que tu
# computador esté encendido), y también se puede disparar a mano desde la
# pestaña "Actions" del repo con el botón "Run workflow".
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # necesario para que el workflow pueda hacer commit del HTML/CSV actualizados

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # sin "cache: pip" ni requirements.txt a propósito: el script no
          # usa ninguna librería externa, solo la estándar de Python.

      - name: DIAGNÓSTICO TEMPORAL -- resolver webmaps restantes y consultar campos reales
        run: |
          python3 - <<'EOF'
          import json, re, urllib.request

          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"}
          PORTAL = "https://geosmart.undp.org/arcgis"

          # itemId de webmap -> etiqueta (resueltos en la corrida anterior desde cada dashboard)
          WEBMAP_IDS = {
              "bad64e816ef34d39ade2a8fe0e72630c": "buildingImpact_publicBldg",
              "9cf4462540384483b0702c845fc92581": "powerOutages",
              "b967205e34c140a9aaba269726380cfe": "buildingExposure",
              "157068340a384d558592c189e983a1dc": "econDamage_adm1",
              "a30456cf7ea44a9a83d08a42f1e95b37": "roadsExposure",
              "c2f2ddc9f5b24eaeb02ebf12bd2698a3": "populationImpact",
              "3dfea17e048d4cd39b118b85c8b1ebec": "buildingImpact_households",
              "270481ad2be54fe5927931f28ed21202": "debris_adm1",
              "901861d1d5824845bf233999a30a3a88": "econDamage_adm2",
              "1e89bcf370e34564979b748805880b61": "earlyRecovery",
              "4ef6d7a3e9d849ba85986f8af69a78ce": "roadsImpact",
              "07e27490e1d042f0b38b8b85d4235e16": "populationExposure",
          }

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, resp.read().decode("utf-8", errors="replace")

          print("=== 1) FeatureServer/MapServer dentro de cada webmap restante ===")
          servicios = {}
          for wid, etiqueta in WEBMAP_IDS.items():
              print(f"--- {etiqueta} ({wid}) ---")
              try:
                  _, data = get(f"{PORTAL}/sharing/rest/content/items/{wid}/data?f=json")
                  urls = sorted(set(re.findall(r'"url"\s*:\s*"([^"]*(?:FeatureServer|MapServer)[^"]*/\d+)"', data)))
                  for u in urls:
                      print("   ", u)
                  servicios[etiqueta] = urls
              except Exception as e:
                  print("   ERROR:", e)
              print()

          print("=== 2) Campos de cada servicio único encontrado ===")
          vistos = set()
          for etiqueta, urls in servicios.items():
              for u in urls:
                  if u in vistos:
                      continue
                  vistos.add(u)
                  try:
                      _, info = get(f"{u}?f=json")
                      d = json.loads(info)
                      print(f"{u}\n   campos: {[f['name'] for f in d.get('fields', [])]}")
                  except Exception as e:
                      print(f"{u}\n   ERROR: {e}")

          print()
          print("=== 3) COL_adm1: fila real (Chocó, decodigo=27) ===")
          base = "https://geosmarthosting.undp.org/arcgis/rest/services/Hosted/COL_adm1/FeatureServer/0"
          try:
              status, rows = get(f"{base}/query?where=decodigo='27'&outFields=decodigo,denombre,debris_total_m3,econ_dmg_households_cop,econ_dmg_infra_cop,econ_dmg_total_cop&f=json")
              print(rows[:2000])
          except Exception as e:
              print("ERROR:", e)

          print()
          print("=== 4) COL_RAPIDA_earthquake_adm2_20260810 (municipal): campos + 1 fila ===")
          base2 = "https://geosmarthosting.undp.org/arcgis/rest/services/Hosted/COL_RAPIDA_earthquake_adm2_20260810/FeatureServer/0"
          try:
              status, info = get(f"{base2}?f=json")
              d = json.loads(info)
              print("campos:", [f["name"] for f in d.get("fields", [])])
          except Exception as e:
              print("ERROR info:", e)
          try:
              status, rows = get(f"{base2}/query?where=1=1&outFields=*&f=json&resultRecordCount=1")
              print(rows[:3000])
          except Exception as e:
              print("ERROR query:", e)
          EOF

      - name: Generar tablero e índice
        run: python actualizar_indice_terremoto.py --out index.html --csv indice_impacto_departamento.csv

      - name: Publicar cambios si hay datos nuevos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualización automática del índice de impacto"
          file_pattern: "index.html indice_impacto_departamento.csv historial_indice.csv indicadores_largo.csv indicadores_largo_no_calculo.csv"
          commit_user_name: "tablero-terremoto-bot"
          commit_user_email: "actions@github.com"
