name: Actualizar datos y tableros
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch: {}
  push:
    branches: [main, formato-largo, reestructuracion-recuperacion]
    paths:
      - '.github/workflows/actualizar.yml'
      - '*.py'
      - 'web/**'
      - 'tests/**'
      - 'data/**'
permissions:
  contents: write
jobs:
  actualizar:
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ github.event_name == 'schedule' && fromJSON('["main","formato-largo","reestructuracion-recuperacion"]') || fromJSON(format('["{0}"]', github.ref_name)) }}
    runs-on: ubuntu-latest
    concurrency:
      group: actualizar-datos-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: DIAGNOSTICO temporal -- anexo IDF
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          pip install openpyxl -q
          mkdir -p /tmp/idf && cd /tmp/idf
          H=colaboracion.dnp.gov.co
          openssl s_client -connect $H:443 -servername $H </dev/null 2>/dev/null > srv.txt || true
          AIA=$(openssl x509 -in srv.txt -noout -text 2>/dev/null | grep -oE 'CA Issuers - URI:http[^ ]*' | head -1 | sed 's/.*URI://')
          cp /etc/ssl/certs/ca-certificates.crt bundle.pem
          if [ -n "$AIA" ]; then
            curl -sS -L --max-time 60 "$AIA" -o inter.der || true
            openssl x509 -inform DER -in inter.der -out inter.pem 2>/dev/null || true
            [ -s inter.pem ] && cat inter.pem >> bundle.pem
          fi
          U="https://$H/CDT/Desarrollo%20Territorial/Desempeno_Fiscal/ResultadosIDF_Nueva_MetodologIa_2023_Act.xlsx"
          curl -sS -L --max-time 240 --cacert bundle.pem "$U" -o idf.xlsx
          ls -l idf.xlsx
          python3 - <<'PYEOF'
          import openpyxl, re
          wb = openpyxl.load_workbook('/tmp/idf/idf.xlsx', data_only=True, read_only=True)
          ws = wb['Municipios 2023']
          rows = list(ws.iter_rows(min_row=1, max_row=8, values_only=True))
          head = [str(c) if c is not None else '' for c in rows[6]]
          ci = head.index('Código')
          oficial = head.index('Nuevo IDF')
          sinb = head.index('Nuevo IDF (sin bonos)')
          print('columnas -> codigo=%d oficial=%d sin_bonos=%d' % (ci, oficial, sinb))
          n = 0
          for r in ws.iter_rows(min_row=8, values_only=True):
              if ci >= len(r):
                  continue
              c = r[ci]
              if c is None:
                  continue
              cs = re.sub(r'\D', '', str(c)).zfill(5)
              if len(cs) != 5:
                  continue
              def num(j):
                  if j >= len(r) or r[j] is None:
                      return ''
                  try:
                      return '%.4f' % float(str(r[j]).replace(',', '.'))
                  except ValueError:
                      return ''
              a, b = num(oficial), num(sinb)
              if not a and not b:
                  continue
              print('IDF,%s,%s,%s' % (cs, a, b))
              n += 1
          print('CSVFIN filas=%d' % n)
          PYEOF
      - name: Verificar importación y cálculos
        run: |
          python -m unittest discover -s tests -v
          if [ -f tests/modelo.test.js ]; then
            node --test tests/*.test.js
            node --check web/tablero.js
          fi
      - name: Descargar datos y regenerar vistas de esta rama
        # Publicar cambios de interfaz en main no depende de fuentes externas.
        # Las descargas conservan su ejecución programada y manual.
        if: github.event_name != 'push' || matrix.branch != 'main'
        run: |
          python actualizar_indice_terremoto.py --out index.html --csv indice_impacto_departamento.csv
          python migrar_clasificacion_3is.py
          if [ -f generar_tablero_recuperacion.py ]; then
            python generar_tablero_recuperacion.py
          else
            python generar_eda_indicadores.py --out eda_indicadores.html
            python generar_indice_educacion.py --out indice_educacion.html
          fi
      - name: Publicar interfaz principal con el inventario conservado
        if: github.event_name == 'push' && matrix.branch == 'main'
        run: python generar_tablero_recuperacion.py
      - name: Verificar familias informativas e interfaz
        if: matrix.branch == 'main'
        run: |
          node scripts/auditar_familias_informativas.cjs
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/familias_informativas.browser.cjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: ${{ matrix.branch }}
          commit_message: 'Actualización automática de datos y tableros'
          file_pattern: '*.html *.csv docs/verificacion_familias_informativas.json'
          commit_user_name: tablero-terremoto-bot
          commit_user_email: actions@github.com


