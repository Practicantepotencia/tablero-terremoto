name: Actualizar tablero de impacto

# Corre solo cada 4 horas en los servidores de GitHub (no depende de que tu
# computador esté encendido), y también se puede disparar a mano desde la
# pestaña "Actions" del repo con el botón "Run workflow".
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # necesario para que el workflow pueda hacer commit del HTML/CSV actualizados

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # sin "cache: pip" ni requirements.txt a propósito: el script no
          # usa ninguna librería externa, solo la estándar de Python.

      - name: DIAGNÓSTICO TEMPORAL -- explorar Dashboards de UNDP geosmart (ArcGIS)
        run: |
          python3 - <<'EOF'
          import json, re, urllib.request

          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"}
          PORTAL = "https://geosmart.undp.org/arcgis"

          DASHBOARD_IDS = [
              "41d019779c5441348a7c3a974bc089c5",
              "5e26cb37fcbe465186c3584cceda03eb",
              "6ab2dc869b7546fca3b932dceaded56b",
              "937e319ee0be45ebb80c11bc5e9b4693",
              "af31f897aeab4af48cee47d10e228033",
              "c1e07ed3548543a2ab9944c66cc8396b",
              "d1a3fd84191c40b7b5295c7c86946162",
              "d7b3e3bc849c4dd1b79df85127574d9e",
              "dac5b57bf91e48b3b5f92e5a0f4c5532",
              "dddb2ced56614af790e778380e43a96a",
              "eb084876238f47a9864f84c23356976e",
              "ed32f179b27c453b8816241ee836361e",
              "fdafdd095d504f4fb12a73ffdd637b73",
          ]
          WEBMAP_IDS = ["a91d938f010c4b87aed6a47de4e53adf", "c05c2d7af49c437dbf47f9f963c1468d"]

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, resp.read().decode("utf-8", errors="replace")

          all_service_urls = set()

          def explorar_item(item_id, etiqueta):
              print(f"--- {etiqueta} ({item_id}) ---")
              try:
                  status, info = get(f"{PORTAL}/sharing/rest/content/items/{item_id}?f=json")
                  d = json.loads(info)
                  print(f"  info: status={status} title={d.get('title')!r} type={d.get('type')} access={d.get('access')}")
              except Exception as e:
                  print("  info ERROR:", e)
              try:
                  status, data = get(f"{PORTAL}/sharing/rest/content/items/{item_id}/data?f=json")
                  print(f"  data: status={status} largo={len(data)} caracteres")
                  urls = re.findall(r'"url"\s*:\s*"([^"]*(?:FeatureServer|MapServer)[^"]*)"', data)
                  for u in sorted(set(urls)):
                      print("   servicio:", u)
                      all_service_urls.add(u)
                  if not urls:
                      print("   (sin FeatureServer/MapServer en el JSON de este item)")
                      print("   fragmento:", data[:800])
              except Exception as e:
                  print("  data ERROR:", e)
              print()

          print("=== Webmaps referenciados por el StoryMap ===")
          for wid in WEBMAP_IDS:
              explorar_item(wid, "webmap")

          print("=== Dashboards referenciados por el StoryMap ===")
          for did in DASHBOARD_IDS:
              explorar_item(did, "dashboard")

          print("=== Resumen: servicios Feature/MapServer encontrados ===")
          for u in sorted(all_service_urls):
              print(u)

          print()
          print("=== Probar query de ejemplo sobre el primer servicio encontrado ===")
          if all_service_urls:
              base = sorted(all_service_urls)[0].rstrip("/")
              try:
                  status, layers = get(f"{base}?f=json")
                  print(f"servicio info: status={status}")
                  print(layers[:2000])
              except Exception as e:
                  print("ERROR servicio info:", e)
              try:
                  status, rows = get(f"{base}/0/query?where=1=1&outFields=*&f=json&resultRecordCount=3")
                  print(f"query capa 0: status={status}")
                  print(rows[:3000])
              except Exception as e:
                  print("ERROR query:", e)
          EOF

      - name: Generar tablero e índice
        run: python actualizar_indice_terremoto.py --out index.html --csv indice_impacto_departamento.csv

      - name: Publicar cambios si hay datos nuevos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualización automática del índice de impacto"
          file_pattern: "index.html indice_impacto_departamento.csv historial_indice.csv indicadores_largo.csv indicadores_largo_no_calculo.csv"
          commit_user_name: "tablero-terremoto-bot"
          commit_user_email: "actions@github.com"
