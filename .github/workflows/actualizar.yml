name: Actualizar tablero de impacto

# Corre solo cada 4 horas en los servidores de GitHub (no depende de que tu
# computador esté encendido), y también se puede disparar a mano desde la
# pestaña "Actions" del repo con el botón "Run workflow".
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # necesario para que el workflow pueda hacer commit del HTML/CSV actualizados

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # sin "cache: pip" ni requirements.txt a propósito: el script no
          # usa ninguna librería externa, solo la estándar de Python.

      - name: DIAGNÓSTICO TEMPORAL 2 -- CSV de Copernicus y hoja de Google Sheets de 3is.org
        run: |
          python3 - <<'EOF'
          import re, urllib.request

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, resp.geturl(), resp.read().decode("utf-8", errors="replace")

          base = "https://3is.org/emergenciaslatam/terremoto_choco/"

          print("=== 1) CSV Copernicus (puntos/dl_copernicus_buildings.csv) ===")
          for candidata in [base + "puntos/dl_copernicus_buildings.csv"]:
              try:
                  status, final_url, body = get(candidata)
                  print(f"status={status} url={final_url} largo={len(body)} caracteres")
                  print("--- primeras 2000 caracteres ---")
                  print(body[:2000])
              except Exception as e:
                  print(f"ERROR al descargar {candidata}:", e)

          print()
          print("=== 2) Buscar docs.google.com / sheets en el HTML principal ===")
          try:
              status, final_url, html = get(base)
          except Exception as e:
              print("ERROR al descargar la página principal:", e)
              raise SystemExit(0)

          for m in re.findall(r'[\'"]([^\'"]*docs\.google\.com[^\'"]*)[\'"]', html, re.IGNORECASE):
              print(m)
          for m in re.findall(r'[\'"]([^\'"]*spreadsheets[^\'"]*)[\'"]', html, re.IGNORECASE):
              print(m)
          for m in re.findall(r'const\s+SHEET[A-Z_]*\s*=\s*[\'"]([^\'"]+)[\'"]', html):
              print("SHEET const:", m)

          print()
          print("=== 3) Otras rutas relativas bajo puntos/ o data/ referenciadas en el HTML ===")
          vistos = set()
          for m in re.findall(r'[\'"]((?:puntos|data)/[^\'"]+)[\'"]', html):
              if m not in vistos:
                  vistos.add(m)
                  print(m)
          EOF

      - name: Generar tablero e índice
        run: python actualizar_indice_terremoto.py --out index.html --csv indice_impacto_departamento.csv

      - name: Publicar cambios si hay datos nuevos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualización automática del índice de impacto"
          file_pattern: "index.html indice_impacto_departamento.csv historial_indice.csv"
          commit_user_name: "tablero-terremoto-bot"
          commit_user_email: "actions@github.com"
