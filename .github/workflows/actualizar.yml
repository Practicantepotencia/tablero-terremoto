name: Actualizar tablero de impacto

# Corre solo cada 4 horas en los servidores de GitHub (no depende de que tu
# computador esté encendido), y también se puede disparar a mano desde la
# pestaña "Actions" del repo con el botón "Run workflow".
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # necesario para que el workflow pueda hacer commit del HTML/CSV actualizados

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # sin "cache: pip" ni requirements.txt a propósito: el script no
          # usa ninguna librería externa, solo la estándar de Python.

      - name: DIAGNÓSTICO TEMPORAL 3 -- leer las 4 hojas de Google Sheets de 3is.org
        run: |
          python3 - <<'EOF'
          import urllib.request

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, resp.read().decode("utf-8", errors="replace")

          sheet_id = "1fQ-LTlIEljzOKvW23epwevJeWLWORi88xL7XxkpTMzY"
          hojas = ["Datos_Territoriales", "Tendencias", "Bitacora_Noticias", "Necesidades"]

          for hoja in hojas:
              url = f"https://docs.google.com/spreadsheets/d/{sheet_id}/gviz/tq?tqx=out:csv&sheet={hoja}"
              print(f"=== {hoja} ===")
              try:
                  status, body = get(url)
                  print(f"status={status} largo={len(body)} caracteres")
                  print(body[:3000])
              except Exception as e:
                  print(f"ERROR al descargar {hoja}:", e)
              print()
          EOF

      - name: Generar tablero e índice
        run: python actualizar_indice_terremoto.py --out index.html --csv indice_impacto_departamento.csv

      - name: Publicar cambios si hay datos nuevos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualización automática del índice de impacto"
          file_pattern: "index.html indice_impacto_departamento.csv historial_indice.csv"
          commit_user_name: "tablero-terremoto-bot"
          commit_user_email: "actions@github.com"
