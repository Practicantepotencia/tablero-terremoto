name: Actualizar tablero de impacto

# Corre solo cada 4 horas en los servidores de GitHub (no depende de que tu
# computador esté encendido), y también se puede disparar a mano desde la
# pestaña "Actions" del repo con el botón "Run workflow".
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # necesario para que el workflow pueda hacer commit del HTML/CSV actualizados

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # sin "cache: pip" ni requirements.txt a propósito: el script no
          # usa ninguna librería externa, solo la estándar de Python.

      - name: DIAGNÓSTICO TEMPORAL -- resolver itemIds de Dashboards y consultar COL_adm1
        run: |
          python3 - <<'EOF'
          import json, re, urllib.request

          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"}
          PORTAL = "https://geosmart.undp.org/arcgis"

          DASHBOARD_IDS = {
              "41d019779c5441348a7c3a974bc089c5": "summary_stats",
              "5e26cb37fcbe465186c3584cceda03eb": "buildingImpact_publicBldg",
              "6ab2dc869b7546fca3b932dceaded56b": "powerOutages",
              "937e319ee0be45ebb80c11bc5e9b4693": "buildingExposure",
              "af31f897aeab4af48cee47d10e228033": "econDamage_adm1",
              "c1e07ed3548543a2ab9944c66cc8396b": "roadsExposure",
              "d1a3fd84191c40b7b5295c7c86946162": "populationImpact",
              "d7b3e3bc849c4dd1b79df85127574d9e": "buildingImpact_households",
              "dac5b57bf91e48b3b5f92e5a0f4c5532": "debris_adm1",
              "dddb2ced56614af790e778380e43a96a": "econDamage_adm2",
              "eb084876238f47a9864f84c23356976e": "earlyRecovery",
              "ed32f179b27c453b8816241ee836361e": "roadsImpact",
              "fdafdd095d504f4fb12a73ffdd637b73": "populationExposure",
          }

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, resp.read().decode("utf-8", errors="replace")

          def resolver_item_a_url(item_id):
              """Devuelve la URL de FeatureServer/MapServer de un item, si la tiene."""
              try:
                  _, info = get(f"{PORTAL}/sharing/rest/content/items/{item_id}?f=json")
                  d = json.loads(info)
                  return d.get("url"), d.get("title"), d.get("type")
              except Exception as e:
                  return None, None, f"ERROR: {e}"

          print("=== 1) itemIds referenciados dentro de cada dashboard -> resolver a FeatureServer ===")
          servicios_por_dashboard = {}
          for did, etiqueta in DASHBOARD_IDS.items():
              print(f"--- dashboard {etiqueta} ({did}) ---")
              try:
                  _, data = get(f"{PORTAL}/sharing/rest/content/items/{did}/data?f=json")
                  item_ids = set(re.findall(r'"itemId"\s*:\s*"([0-9a-f]{32})"', data))
                  item_ids.discard(did)
                  urls = []
                  for iid in item_ids:
                      url, title, typ = resolver_item_a_url(iid)
                      print(f"   itemId={iid} title={title!r} type={typ} url={url}")
                      if url:
                          urls.append(url)
                  servicios_por_dashboard[etiqueta] = urls
              except Exception as e:
                  print("   ERROR:", e)
              print()

          print("=== 2) Consultar capa COL_adm1 (departamentos) -- campos y primera fila ===")
          base = "https://geosmarthosting.undp.org/arcgis/rest/services/Hosted/COL_adm1/FeatureServer/0"
          try:
              status, info = get(f"{base}?f=json")
              d = json.loads(info)
              print("campos:", [f["name"] for f in d.get("fields", [])])
          except Exception as e:
              print("ERROR info:", e)
          try:
              status, rows = get(f"{base}/query?where=1=1&outFields=*&f=json&resultRecordCount=2")
              print(f"query: status={status}")
              print(rows[:4000])
          except Exception as e:
              print("ERROR query:", e)

          print()
          print("=== 3) Resumen final: servicios por dashboard ===")
          for etiqueta, urls in servicios_por_dashboard.items():
              print(f"{etiqueta}: {urls}")
          EOF

      - name: Generar tablero e índice
        run: python actualizar_indice_terremoto.py --out index.html --csv indice_impacto_departamento.csv

      - name: Publicar cambios si hay datos nuevos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualización automática del índice de impacto"
          file_pattern: "index.html indice_impacto_departamento.csv historial_indice.csv indicadores_largo.csv indicadores_largo_no_calculo.csv"
          commit_user_name: "tablero-terremoto-bot"
          commit_user_email: "actions@github.com"
