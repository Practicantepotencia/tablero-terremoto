name: Actualizar tablero de impacto

# Corre solo cada 4 horas en los servidores de GitHub (no depende de que tu
# computador esté encendido), y también se puede disparar a mano desde la
# pestaña "Actions" del repo con el botón "Run workflow".
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # necesario para que el workflow pueda hacer commit del HTML/CSV actualizados

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # sin "cache: pip" ni requirements.txt a propósito: el script no
          # usa ninguna librería externa, solo la estándar de Python.

      - name: DIAGNÓSTICO TEMPORAL -- explorar Fundación Éxito "Un millón de razones"
        run: |
          python3 - <<'EOF'
          import re, urllib.request

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8",
              "Accept-Language": "es-CO,es;q=0.9,en;q=0.8",
              "Referer": "https://www.google.com/",
          }

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.status, resp.geturl(), resp.read().decode("utf-8", errors="replace")

          try:
              status, final_url, html = get("https://fundacionexe.org.co/unmillonderazones/")
          except Exception as e:
              print("ERROR al descargar la página:", e)
              raise SystemExit(0)

          print(f"status={status} final_url={final_url} largo={len(html)} caracteres")
          print()
          print("--- primeros 3000 caracteres del HTML ---")
          print(html[:3000])
          print()
          print("--- pistas de endpoints de datos (api/json/arcgis/geojson/csv/download/embed/sheet) ---")
          patrones = re.findall(
              r'[\'"]([^\'"]*(?:api|\.json|arcgis|geojson|\.csv|\.xlsx|download|embed|sheet|spreadsheet)[^\'"]*)[\'"]',
              html, re.IGNORECASE,
          )
          vistos = set()
          for p in patrones:
              if p not in vistos:
                  vistos.add(p)
                  print(p)
          print(f"({len(vistos)} pistas únicas)")

          print()
          print("--- iframes / scripts src ---")
          for m in re.findall(r'<(?:iframe|script)[^>]+src=["\']([^"\']+)["\']', html, re.IGNORECASE):
              print(m)

          print()
          print("--- enlaces <a href> que parecen archivos o secciones internas ---")
          for m in re.findall(r'<a[^>]+href=["\']([^"\']+)["\']', html, re.IGNORECASE):
              if any(k in m.lower() for k in ("dato", "descarg", "map", "tablero", "dashboard", ".csv", ".xlsx", ".json", ".pdf")):
                  print(m)
          EOF

      - name: Generar tablero e índice
        run: python actualizar_indice_terremoto.py --out index.html --csv indice_impacto_departamento.csv

      - name: Publicar cambios si hay datos nuevos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualización automática del índice de impacto"
          file_pattern: "index.html indice_impacto_departamento.csv historial_indice.csv indicadores_largo.csv indicadores_largo_no_calculo.csv"
          commit_user_name: "tablero-terremoto-bot"
          commit_user_email: "actions@github.com"
